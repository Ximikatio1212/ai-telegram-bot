# Конфигурация для Render
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ai-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
